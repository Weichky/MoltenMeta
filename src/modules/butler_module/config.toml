[module]
package_name = "butler_module"
entry_class = "ButlerCalc"
all_methods = ["solve"]
type = "simulation"
category = "surface_tension"
version = "1.0.0"
author = "Weichky"
license = "MIT"
description = "Butler surface tension model with switchable data sources and Monte Carlo uncertainty propagation"

[fit.inputs]
symbol = ["config"]
input_method = "raw"

[fit.inputs.raw]
method_map = [
    ["config", "dict_input"]
]

[fit.inputs.description]
config = "ButlerConfig containing L_coeffs, Sigma_L, order, elem_A, elem_B"

[fit.inputs.unit]
config = ""


[solve.inputs]
symbol = ["T", "x_bulk_A"]
input_method = "raw"

[solve.inputs.raw]
method_map = [
    ["T", "float_input"],
    ["x_bulk_A", "float_input"]
]

[solve.inputs.description]
T = "Temperature in K"
x_bulk_A = "Bulk mole fraction of component A"

[solve.inputs.unit]
T = "K"
x_bulk_A = ""

[solve.outputs]
symbol = ["sigma"]
tags = ["sigma", "surface_tension", "binary_data"]
is_virtual = true

[solve.outputs.latex]
sigma = "\\sigma"

[solve.outputs.description]
sigma = "Surface tension"

[solve.outputs.unit]
sigma = "N/m"